<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10151b" />
    <meta name="description" content="A local-first photo editing workspace." />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/icons/icon.svg" type="image/svg+xml" />
    <script src="./theme-init.js"></script>
    <link rel="stylesheet" href="./styles.css" />
    <title>Nuro Photo Studio</title>
  </head>
  <body>
    <div class="app-shell">
      <aside id="sidebar" class="sidebar" aria-label="Main navigation">
        <a class="brand" href="#home" aria-label="Nuro Photo Studio home"><span class="brand-mark">N</span><span class="brand-name">Nuro <strong>Photo Studio</strong></span></a>
        <p class="eyebrow sidebar-label">WORKSPACE</p>
        <nav id="primary-navigation" class="primary-navigation" aria-label="Primary">
          <div id="navigation-items" class="navigation-items"></div>
        </nav>
        <div class="sidebar-bottom"><span class="status-dot"></span><span>Files stay on this device</span><span class="version">v0.1.0</span></div>
      </aside>

      <div class="app-main">
        <header class="topbar">
          <button id="menu-toggle" class="icon-button menu-toggle" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="Open navigation"><span aria-hidden="true">☰</span></button>
          <div class="screen-heading"><p class="eyebrow">NURO PHOTO STUDIO</p><h1 id="screen-title">Home</h1></div>
          <div class="top-actions">
            <button id="theme-toggle" class="button secondary theme-toggle" type="button" aria-pressed="false" aria-label="Switch to light theme"><span class="theme-icon" aria-hidden="true">☼</span><span class="theme-label">Light theme</span></button>
            <span class="privacy"><i></i> Files stay on this device</span>
          </div>
        </header>

        <main id="main" class="main-content dashboard" tabindex="-1" aria-labelledby="dashboard-title"></main>
      </div>
      <button id="sidebar-backdrop" class="sidebar-backdrop" type="button" aria-label="Close navigation" tabindex="-1" hidden></button>
    </div>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
