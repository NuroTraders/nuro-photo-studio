appId: com.nuro.photostudio
productName: Nuro Photo Studio
directories:
  output: release
  buildResources: electron/resources
files:
  - dist/**
  - electron/main.cjs
  - electron/preload.cjs
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
